# Facade core's workspace. Each crate adds its own member line, and its path in
# `[workspace.dependencies]` already names it; see core/README.md for what each crate is.
[workspace]
resolver = "3"
members = [
	"crates/relay",
	"crates/base",
	"crates/keeper",
	"crates/daemon",
	"crates/facade",
	"tests",
	# A member so that its own tests run with Facade's (vendor/README.md).
	"vendor/alacritty_terminal",
	"crates/screen",
	"crates/rules",
]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/y5ez3g/facadecode"
rust-version = "1.98"

[workspace.dependencies]
facade-base = { path = "crates/base" }
facade-screen = { path = "crates/screen" }
facade-rules = { path = "crates/rules" }
facade-keeper = { path = "crates/keeper" }
facade-daemon = { path = "crates/daemon" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
tokio = { version = "1.54", features = ["full"] }
alacritty_terminal = "0.26"
nix = { version = "0.31", features = ["term", "process", "signal", "socket", "uio", "fs", "ioctl", "user", "poll"] }
libc = "0.2"
crossterm = "0.29"
clap = { version = "4.6", features = ["derive", "wrap_help"] }
signal-hook = "0.4"
sha2 = "0.10"
schemars = "1.2"
rusqlite = { version = "0.41", features = ["bundled"] }
regex = "1.13"
toml = "1.2"
unicode-segmentation = "1.13"
unicode-width = "0.2"

# alacritty_terminal 0.26.0 with the changes that keep each agent's screen within its memory
# bound; vendor/README.md lists each change and why.
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "unwind"

# Optimize terminal parsing in development builds to keep screen and scenario tests fast. Debug
# assertions remain enabled.
[profile.dev.package.alacritty_terminal]
opt-level = 2

[profile.dev.package.vte]
opt-level = 2

[profile.dev.package.facade-screen]
opt-level = 2
