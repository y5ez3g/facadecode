name: Extension checks

on:
  pull_request:
    paths:
      - 'extension/**'
      - 'framework/**'
      - 'docs/extension/**'
      - '.github/workflows/extension-check.yml'
      - '.github/workflows/extension-release.yml'
      - 'ci/acceptance.py'
      - 'ci/catalog.py'
      - 'ci/check_native_install.py'
      - 'ci/evidence.py'
      - 'ci/editor_archive.py'
      - 'ci/native_framework.py'
      - 'ci/run_native_extension.py'
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the Windows packages' programs, as a release does
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: The tag or commit to build and test
        required: true
        type: string
      sign:
        description: Sign the Windows packages' programs
        type: boolean
        default: false
      package_only:
        description: Build and verify the packages after full checks have passed for this source tree
        type: boolean
        default: false
    outputs:
      package_attempt:
        description: The workflow attempt that recorded the Linux x64 native package
        value: ${{ jobs.verify.outputs.package_attempt }}

permissions:
  contents: read
  # For azure/login alone, which signs in to Azure only from the extension-signing environment
  id-token: write

concurrency:
  group: extension-check-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Extension on ${{ matrix.target }}, ${{ matrix.implementation }} implementation
    outputs:
      package_attempt: ${{ steps.native-package-evidence.outputs.attempt }}
    # Every target runs the editor journeys on the legacy implementation (`facade.framework` off) and runs them
    # again on the Framework implementation in a job of its own, which builds and tests nothing else.
    # A signing run's Windows packages are signed (ARCHITECTURE-4.3) in the environment Azure trusts with the signing identity.
    environment: ${{ inputs.sign && startsWith(matrix.target, 'win32-') && matrix.implementation == 'legacy' && 'extension-signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        implementation: ${{ fromJSON(inputs.package_only && '["legacy"]' || '["legacy","framework"]') }}
        target: [linux-x64, linux-arm64, win32-x64, win32-arm64, darwin-arm64, darwin-x64]
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: win32-x64 }
          - { os: windows-11-arm, target: win32-arm64 }
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
    runs-on: ${{ matrix.os }}
    # The windows-11-arm jobs take 37 to 45 minutes unsigned; signing adds about half a minute
    timeout-minutes: 60
    env:
      FACADE_PACKAGE_TARGET: ${{ matrix.target }}
      FACADE_SIGN: ${{ inputs.sign && startsWith(matrix.target, 'win32-') && matrix.implementation == 'legacy' && '--sign' || '' }}
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: bash
        working-directory: extension
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: extension/.nvmrc
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the native package target
        run: |
          node --input-type=module <<'JS'
          import { packageTarget } from './scripts/native.mjs';
          console.info(`Building and testing ${packageTarget(process.env.FACADE_PACKAGE_TARGET)}`);
          JS
      # Framework's programs go in every package: the toolchain framework pins, on Linux for musl, the target scripts/framework.mjs builds
      - name: Rust toolchain for framework
        working-directory: framework
        run: rustup toolchain install
      # rustup target add acts on the toolchain of the directory it runs in: framework's pinned one, which builds, not the runner's default
      - name: musl for framework on Linux
        if: runner.os == 'Linux'
        working-directory: framework
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >> "$GITHUB_ENV"
      - name: Cache Intel macOS editor build dependencies
        if: github.event_name == 'pull_request' && matrix.target == 'darwin-x64' && matrix.implementation == 'framework'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: framework
          key: native-editor-release-darwin-x64-framework
          cache-bin: false
      - name: Download official VS Code for isolated tests
        if: "!inputs.package_only"
        timeout-minutes: 9
        run: |
          python -B ../ci/editor_archive.py "$FACADE_PACKAGE_TARGET" \
            --cache "$RUNNER_TEMP/facade-desktop-cache" --stage "$RUNNER_TEMP/facade-desktop" \
            --log "$RUNNER_TEMP/facade-desktop.log" --github-env "$GITHUB_ENV"
      - run: npm ci
      - run: npm run compile
        if: "!inputs.package_only"
      - run: npm test
        if: "!inputs.package_only && matrix.implementation == 'legacy'"
      - name: Release script tests
        id: release-tests
        if: "!inputs.package_only && runner.os == 'Linux' && matrix.implementation == 'legacy'"
        run: |
          if [[ "$FACADE_PACKAGE_TARGET" == linux-x64 && "$GITHUB_EVENT_NAME" == pull_request ]]; then
            mkdir -p "$RUNNER_TEMP/release-fixture"
            node --test --test-reporter=tap scripts/release.test.mjs | tee "$RUNNER_TEMP/release-fixture/release.tap"
          else
            node --test scripts/release.test.mjs
          fi
      - name: Record the release fixture results
        if: github.event_name == 'pull_request' && matrix.target == 'linux-x64' && matrix.implementation == 'legacy' && steps.release-tests.outcome == 'success'
        run: node scripts/release-fixture-evidence.mjs stamp "$RUNNER_TEMP/release-fixture"
      - name: Keep the release fixture output
        if: >-
          always() && github.event_name == 'pull_request' && matrix.target == 'linux-x64' && matrix.implementation == 'legacy' &&
          (steps.release-tests.outcome == 'success' || steps.release-tests.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-fixture-linux-x64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-fixture/
          if-no-files-found: error
      - run: node scripts/l10n.mjs check
        if: "!inputs.package_only && matrix.implementation == 'legacy'"
      - run: python ../docs/extension/audit/check_spec.py
        if: "!inputs.package_only && matrix.implementation == 'legacy'"
      # Signing: the Artifact Signing client, made for x64 alone, on an x64 .NET 8 - emulated on Arm - and Azure's sign-in
      - uses: actions/setup-dotnet@v5
        if: env.FACADE_SIGN
        with:
          dotnet-version: 8.0.x
          architecture: x64
      - name: Artifact Signing client
        if: env.FACADE_SIGN
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\artifact-signing"
          Invoke-WebRequest https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/1.0.151/microsoft.artifactsigning.client.1.0.151.nupkg -OutFile "$dir.zip"
          if ((Get-FileHash "$dir.zip" -Algorithm SHA256).Hash -ne '35375A4BC4E1102DA729FC3D8D9925F774C3BAAE6B8B7FF6398D948CA9AB0D8A') { throw 'The Artifact Signing client is not the one this workflow names.' }
          Expand-Archive "$dir.zip" $dir
          "ARTIFACT_SIGNING_DLIB=$dir\bin\x64\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
      # The identity's one role is on the certificate profile: it signs, and needs no subscription
      - uses: azure/login@v2
        if: env.FACADE_SIGN
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - run: npm run package -- --target "$FACADE_PACKAGE_TARGET" $FACADE_SIGN
        if: matrix.implementation == 'legacy'
      - run: npm run test:package
        if: matrix.implementation == 'legacy'
      - name: Pack framework from the native VSIX
        if: matrix.implementation == 'legacy'
        run: |
          node ../framework/scripts/package-framework.mjs --target "$FACADE_PACKAGE_TARGET" \
            --vsix "build/vsix/facadecode-$FACADE_PACKAGE_TARGET-"*.vsix --out-dir build/framework
      - name: Install the local framework archive on Linux and macOS
        if: matrix.implementation == 'legacy' && runner.os != 'Windows'
        run: |
          root=$(mktemp -d "$RUNNER_TEMP/facade-install.XXXXXX")
          mkdir "$root/home" "$root/tmp"
          build=$(cat bin/VERSION)
          env -i HOME="$root/home" PATH="$PATH" FACADE_HOME="$root/state" TMPDIR="$root/tmp" \
            sh ../framework/install.sh --version "${build%%+*}" --expected-build "$build" \
            --package "build/framework/facade-framework-$FACADE_PACKAGE_TARGET.tar.gz" --no-path --no-activate
          test "$("$root/state/framework/bin/facade" --version)" = "facade $build"
          test -x "$root/state/framework/bin/facade-mcp"
      - name: Install the local framework archive on Windows
        if: matrix.implementation == 'legacy' && runner.os == 'Windows'
        shell: powershell
        run: |
          $target = $env:FACADE_PACKAGE_TARGET
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(FACADE|CLAUDE)_' } |
            ForEach-Object { Remove-Item -LiteralPath "Env:$($_.Name)" }
          $root = Join-Path $env:RUNNER_TEMP ("facade-install-" + [guid]::NewGuid())
          $env:USERPROFILE = $env:HOME = Join-Path $root 'home'
          $env:LOCALAPPDATA = Join-Path $env:HOME 'AppData\Local'
          $env:APPDATA = Join-Path $env:HOME 'AppData\Roaming'
          $env:FACADE_HOME = Join-Path $root 'state'
          $env:TEMP = $env:TMP = Join-Path $root 'tmp'
          New-Item -ItemType Directory -Path $env:TEMP | Out-Null
          $build = (Get-Content -Raw -LiteralPath 'bin/VERSION').Trim()
          $version = ($build -split '\+', 2)[0]
          & ..\framework\install.ps1 -Version $version -ExpectedBuild $build -Package "build\framework\facade-framework-$target.zip" -NoPath -NoActivate
          $bin = Join-Path $env:FACADE_HOME 'framework\bin'
          $reported = & "$bin\facade.exe" --version
          if ($LASTEXITCODE -ne 0 -or $reported -cne "facade $build") { throw 'Installed facade did not report the exact BUILD.' }
          foreach ($file in 'facade-mcp.exe', "$build\conpty\OpenConsole.exe", "$build\conpty\conpty.dll") {
            if (-not (Test-Path -LiteralPath "$bin\$file" -PathType Leaf)) { throw "Missing $file." }
          }
      - name: Verify the installed Linux x64 candidate
        if: github.event_name == 'pull_request' && matrix.target == 'linux-x64' && matrix.implementation == 'legacy'
        run: |
          mkdir -p build/native-install
          (cd ../framework && cargo build --locked --release --target x86_64-unknown-linux-musl \
            -p facade-scenarios --bin facade-fakecli)
          archive=build/framework/facade-framework-linux-x64.tar.gz
          cp build/framework/SHA256SUMS build/native-install/SHA256SUMS
          checksums=build/native-install/SHA256SUMS
          receipt=build/native-install/receipt.json
          output=build/native-install/output.log
          python -B ../ci/check_native_install.py "$archive" "$checksums" \
            ../framework/target/x86_64-unknown-linux-musl/release/facade-fakecli --receipt "$receipt" | tee "$output"
          python -B ../ci/acceptance.py verify-native-install "$archive" "$checksums" "$receipt" "$output" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the Linux x64 candidate install evidence
        if: always() && github.event_name == 'pull_request' && matrix.target == 'linux-x64' && matrix.implementation == 'legacy'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-install-linux-x64-${{ github.run_attempt }}
          path: extension/build/native-install/
          if-no-files-found: ignore
      # The Framework implementation's journeys need the built extension and framework's programs (scripts/build-it.mjs), not the packages
      - run: npm run bundle
        if: matrix.implementation == 'framework'
      - name: Build the isolated editor fixtures
        if: "!inputs.package_only"
        run: node scripts/build-it.mjs
      - name: Isolated editor journeys on Linux
        if: "!inputs.package_only && runner.os == 'Linux'"
        env:
          FACADE_IT_IMPLEMENTATION: ${{ matrix.implementation }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$FACADE_PACKAGE_TARGET" == linux-x64 && "$FACADE_IT_IMPLEMENTATION" == framework ]]; then
            python -B ../ci/run_native_extension.py xvfb-run -a node build/out/test/integration/run.js 2>&1 | tee build/integration.log
          else
            xvfb-run -a node build/out/test/integration/run.js 2>&1 | tee build/integration.log
          fi
      - name: Isolated editor journeys on Windows
        if: "!inputs.package_only && runner.os == 'Windows'"
        env:
          FACADE_IT_IMPLEMENTATION: ${{ matrix.implementation }}
        run: |
          # A detached Windows helper can keep a logging pipe open after the test runner exits.
          status=0
          node build/out/test/integration/run.js > build/integration.log 2>&1 || status=$?
          cat build/integration.log
          exit "$status"
      - name: Isolated editor journeys on macOS
        if: "!inputs.package_only && runner.os == 'macOS'"
        env:
          FACADE_IT_IMPLEMENTATION: ${{ matrix.implementation }}
        run: node build/out/test/integration/run.js 2>&1 | tee build/integration.log
      - name: Keep editor test output
        if: always() && !inputs.package_only
        uses: actions/upload-artifact@v4
        with:
          name: editor-tests-${{ matrix.target }}-${{ matrix.implementation }}
          path: extension/build/integration.log
          if-no-files-found: ignore
      - name: Record the tested native package digests
        id: native-package-evidence
        if: matrix.implementation == 'legacy'
        run: |
          node scripts/native-package-evidence.mjs stamp build --target "$FACADE_PACKAGE_TARGET" $FACADE_SIGN
          if [[ "$FACADE_PACKAGE_TARGET" == linux-x64 ]]; then
            echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep tested packages
        if: matrix.implementation == 'legacy'
        uses: actions/upload-artifact@v4
        with:
          name: extension-${{ matrix.target }}
          path: |
            extension/build/vsix/*.vsix
            extension/build/framework/facade-framework-*
            extension/build/framework/SHA256SUMS
            extension/build/native-package-evidence.json
          if-no-files-found: error
      - name: Record the checked-out source tree
        if: "!inputs.package_only && matrix.target == 'linux-x64' && matrix.implementation == 'legacy'"
        run: git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/extension-tested-tree.txt"
      - name: Keep the checked-out source tree
        if: "!inputs.package_only && matrix.target == 'linux-x64' && matrix.implementation == 'legacy'"
        uses: actions/upload-artifact@v4
        with:
          name: tested-extension-tree
          path: ${{ runner.temp }}/extension-tested-tree.txt
          if-no-files-found: error
