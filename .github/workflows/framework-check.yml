name: Framework checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: B-CI-04 probes on Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: powershell
        working-directory: framework
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 16b8d52906b5e25d6e66ebfe08e0953afddf609a
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: framework
      - name: Build the exact source and run the probe scenarios
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne '16b8d52906b5e25d6e66ebfe08e0953afddf609a' -or @(git status --porcelain).Count) { throw 'source checkout mismatch' }
          $env:FACADE_BUILD = git show -s --format='%ct.%H' HEAD
          $env:VSCMD_SKIP_SENDTELEMETRY = '1'
          $out = Join-Path $env:RUNNER_TEMP 'b-ci-04-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          $revision | Set-Content (Join-Path $out 'revision.txt')
          rustc -vV | Tee-Object -FilePath (Join-Path $out 'rustc.txt')
          cargo build --locked -p facade -p facade-relay -p facade-scenarios --bin facade --bin facade-mcp --bin facade-fakecli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p facade-scenarios --test probes --no-run
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .\target\debug\facade.exe --version | Tee-Object -FilePath (Join-Path $out 'version.txt')
          & .\target\debug\facade-mcp.exe --version | Add-Content (Join-Path $out 'version.txt')
          Get-FileHash -Algorithm SHA256 .\target\debug\facade.exe, .\target\debug\facade-mcp.exe, .\target\debug\facade-fakecli.exe |
            Select-Object Algorithm, Hash, Path | ConvertTo-Json | Set-Content (Join-Path $out 'hashes.json')
          $scope = Join-Path (Split-Path $env:GITHUB_WORKSPACE) ('.test-temp\fixw-windows-b-ci-04-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $profile_ = Join-Path $scope 'profile'
          $roaming = Join-Path $profile_ 'AppData\Roaming'
          $local = Join-Path $profile_ 'AppData\Local'
          New-Item -ItemType Directory -Force $roaming, $local | Out-Null
          if (-not $env:CARGO_HOME) { $env:CARGO_HOME = Join-Path $env:USERPROFILE '.cargo' }
          if (-not $env:RUSTUP_HOME) { $env:RUSTUP_HOME = Join-Path $env:USERPROFILE '.rustup' }
          $env:GIT_CONFIG_GLOBAL = Join-Path $scope 'gitconfig'
          @('[user]', '    name = Facade QA', '    email = qa@example.invalid') | Set-Content $env:GIT_CONFIG_GLOBAL
          $env:USERPROFILE = $env:HOME = $profile_
          $env:APPDATA = $roaming
          $env:LOCALAPPDATA = $local
          $env:TMP = $env:TEMP = $env:TMPDIR = $scope
          $env:FACADE_HOME = Join-Path $profile_ '.facade'
          $env:FACADE_TEST_BINARIES_BUILT = '1'
          $env:FACADE_SCENARIO_KEEP = '1'
          $began = [DateTime]::UtcNow.ToFileTimeUtc()
          $log = Join-Path $out 'probes.log'
          try {
            & cmd.exe /d /c "cargo test --locked -p facade-scenarios --test probes -- --nocapture > `"$log`" 2>&1"
            $code = $LASTEXITCODE
            Get-Content -LiteralPath $log
            if ($code -eq 0) {
              # This diagnostic reuses the pinned product binaries. The clean probe run above is the gate.
              $testFile = Join-Path (Get-Location).Path 'tests\tests\probes.rs'
              $sourceBytes = [IO.File]::ReadAllBytes($testFile)
              $heldReceipt = @'
          
          
          // Diagnostic only: hold an already-settled send at the existing reply barrier.
          #[test]
          fn b_ci_04_held_probe_receipt() {
              let setup = |label| {
                  let home = TestHome::new(label);
                  home.start_facade_with(&[("FACADE_TEST_GATES", "before-send-answer")]);
                  start(
                      &home,
                      "muse",
                      &[
                          ("FAKECLI_DRAFT_AT_START", DRAFT),
                          ("FAKECLI_NO_LEADING_SPACE", "1"),
                      ],
                      DRAFT,
                  );
                  home
              };
              let clock = std::time::Instant::now();
              let home = setup("probe-diag-shell");
              let started = std::time::Instant::now();
              let command = home
                  .command(&test_binaries().facade)
                  .args(["send", "muse", "a message", "-w", "-t", &SEND_TIMEOUT.to_string()])
                  .stdin(Stdio::null())
                  .stdout(Stdio::piped())
                  .stderr(Stdio::piped())
                  .spawn()
                  .unwrap();
              home.wait_for_gate("before-send-answer");
              eprintln!("shell: settled at {:?}", started.elapsed());
              assert!(home.screen("muse").contains(DRAFT), "control IPC is alive");
              let output = command.wait_with_output().unwrap();
              eprintln!("shell: ended at {:?}, {}", started.elapsed(), stderr(&output));
              assert!(!output.status.success());
              assert!(!stderr(&output).contains("The delivery deadline passed before its terminal was ready."));
              #[cfg(windows)]
              assert!(stderr(&output).contains("the named pipe did not answer in time"));
              home.release_gate("before-send-answer");
              assert_eq!(pressed(&keys_file(&home, "muse")), b" ");
          
              let home = setup("probe-diag-wire");
              let mut wire = connect(&home);
              let started = std::time::Instant::now();
              let id = wire.send(
                  "call",
                  json!({
                      "op": "agent.send",
                      "args": { "to": "muse", "text": "a message", "wait_for": "delivery", "time_left_ms": 9_000 },
                  }),
              );
              home.wait_for_gate("before-send-answer");
              eprintln!("wire: settled at {:?}", started.elapsed());
              let shell_deadline_remaining = secs(9).saturating_sub(started.elapsed());
              assert!(wire.wait_for_response(id, shell_deadline_remaining).is_none());
              home.release_gate("before-send-answer");
              let answer = wire.wait_for_response(id, LOADED_TIMEOUT).unwrap();
              eprintln!("wire: answered at {:?}: {answer}", started.elapsed());
              let receipt = &answer["result"];
              assert_eq!(receipt["message"]["delivery"]["status"], "failure", "{answer}");
              assert!(matches!(receipt["message"]["delivery"]["reason"].as_str(), Some("input_unknown" | "timeout")), "{answer}");
              assert_eq!(receipt["message"]["delivery"]["text_written"], "none", "{answer}");
              assert_eq!(receipt["message"]["delivery"]["enter_written"], false, "{answer}");
              assert_eq!(receipt["withdrawn"], true, "{answer}");
              assert_eq!(pressed(&keys_file(&home, "muse")), b" ");
              eprintln!("controls elapsed {:?}", clock.elapsed());
          }
          '@
              $heldLog = Join-Path $out 'held-receipt.log'
              try {
                [IO.File]::AppendAllText($testFile, "`n" + $heldReceipt + "`n")
                & cmd.exe /d /c "cargo test --locked -p facade-scenarios --test probes b_ci_04_held_probe_receipt -- --nocapture > `"$heldLog`" 2>&1"
                $heldCode = $LASTEXITCODE
                Get-Content -LiteralPath $heldLog
                "clean-probes=$code held-receipt=$heldCode" | Set-Content (Join-Path $out 'checks.txt')
                if ($heldCode -ne 0) { $code = $heldCode }
              } finally {
                [IO.File]::WriteAllBytes($testFile, $sourceBytes)
              }
            }
            foreach ($case in Get-ChildItem -LiteralPath $scope -Directory -Filter 'fcs-probe*') {
              $caseOut = Join-Path $out $case.Name
              New-Item -ItemType Directory -Force $caseOut | Out-Null
              Get-ChildItem -LiteralPath $case.FullName -Recurse -File |
                Where-Object { $_.Name -in @('daemon.log', 'keeper.log', 'fake.log', 'muse.keys') } |
                Copy-Item -Destination $caseOut
            }
            $ps = (Get-Process -Id $PID).Path
            $left = & $ps -NoProfile -ExecutionPolicy Bypass -File scripts\leftovers.ps1 $scope (Get-Location).Path -Since $began 2>&1
            $leftCode = $LASTEXITCODE
            @($left) | Set-Content (Join-Path $out 'leftovers.log')
            if ($code -eq 0 -and $leftCode -ne 0) { $code = $leftCode }
          } finally {
            foreach ($name in 'TMP','TEMP','TMPDIR') {
              [Environment]::SetEnvironmentVariable($name, $env:RUNNER_TEMP, 'Process')
            }
            Remove-Item -LiteralPath $scope -Recurse -Force
          }
          exit $code
      - name: Keep probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-ci-04-probes-win32-arm64
          path: ${{ runner.temp }}/b-ci-04-evidence
          if-no-files-found: error
