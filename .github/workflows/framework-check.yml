name: Framework checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    name: B-CI-04 probes on Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: '0'
    defaults:
      run:
        shell: powershell
        working-directory: framework
    steps:
      - uses: actions/checkout@v5
        with:
          ref: b0ffea141cf3ab55110cfc12ae18e9b336317457
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: framework
      - name: Build the exact source and run the probe scenarios
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $revision -ne 'b0ffea141cf3ab55110cfc12ae18e9b336317457' -or @(git status --porcelain).Count) { throw 'source checkout mismatch' }
          $env:FACADE_BUILD = git show -s --format='%ct.%H' HEAD
          $env:VSCMD_SKIP_SENDTELEMETRY = '1'
          $out = Join-Path $env:RUNNER_TEMP 'b-ci-04-evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          $revision | Set-Content (Join-Path $out 'revision.txt')
          rustc -vV | Tee-Object -FilePath (Join-Path $out 'rustc.txt')
          cargo build --locked -p facade -p facade-relay -p facade-scenarios --bin facade --bin facade-mcp --bin facade-fakecli
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --locked -p facade-scenarios --test probes --no-run
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & .\target\debug\facade.exe --version | Tee-Object -FilePath (Join-Path $out 'version.txt')
          & .\target\debug\facade-mcp.exe --version | Add-Content (Join-Path $out 'version.txt')
          Get-FileHash -Algorithm SHA256 .\target\debug\facade.exe, .\target\debug\facade-mcp.exe, .\target\debug\facade-fakecli.exe |
            Select-Object Algorithm, Hash, Path | ConvertTo-Json | Set-Content (Join-Path $out 'hashes.json')
          $scope = Join-Path (Split-Path $env:GITHUB_WORKSPACE) ('.test-temp\fixw-windows-b-ci-04-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $profile_ = Join-Path $scope 'profile'
          $roaming = Join-Path $profile_ 'AppData\Roaming'
          $local = Join-Path $profile_ 'AppData\Local'
          New-Item -ItemType Directory -Force $roaming, $local | Out-Null
          if (-not $env:CARGO_HOME) { $env:CARGO_HOME = Join-Path $env:USERPROFILE '.cargo' }
          if (-not $env:RUSTUP_HOME) { $env:RUSTUP_HOME = Join-Path $env:USERPROFILE '.rustup' }
          $env:GIT_CONFIG_GLOBAL = Join-Path $scope 'gitconfig'
          @('[user]', '    name = Facade QA', '    email = qa@example.invalid') | Set-Content $env:GIT_CONFIG_GLOBAL
          $env:USERPROFILE = $env:HOME = $profile_
          $env:APPDATA = $roaming
          $env:LOCALAPPDATA = $local
          $env:TMP = $env:TEMP = $env:TMPDIR = $scope
          $env:FACADE_HOME = Join-Path $profile_ '.facade'
          $env:FACADE_TEST_BINARIES_BUILT = '1'
          $env:FACADE_SCENARIO_KEEP = '1'
          $began = [DateTime]::UtcNow.ToFileTimeUtc()
          $log = Join-Path $out 'probes.log'
          try {
            & cmd.exe /d /c "cargo test --locked -p facade-scenarios --test probes -- --nocapture > `"$log`" 2>&1"
            $code = $LASTEXITCODE
            Get-Content -LiteralPath $log
            foreach ($case in Get-ChildItem -LiteralPath $scope -Directory -Filter 'fcs-probe*') {
              $caseOut = Join-Path $out $case.Name
              New-Item -ItemType Directory -Force $caseOut | Out-Null
              Get-ChildItem -LiteralPath $case.FullName -Recurse -File |
                Where-Object { $_.Name -in @('daemon.log', 'keeper.log', 'fake.log', 'muse.keys') } |
                Copy-Item -Destination $caseOut
            }
            $ps = (Get-Process -Id $PID).Path
            $left = & $ps -NoProfile -ExecutionPolicy Bypass -File scripts\leftovers.ps1 $scope (Get-Location).Path -Since $began 2>&1
            $leftCode = $LASTEXITCODE
            @($left) | Set-Content (Join-Path $out 'leftovers.log')
            if ($code -eq 0 -and $leftCode -ne 0) { $code = $leftCode }
          } finally {
            foreach ($name in 'TMP','TEMP','TMPDIR') {
              [Environment]::SetEnvironmentVariable($name, $env:RUNNER_TEMP, 'Process')
            }
            Remove-Item -LiteralPath $scope -Recurse -Force
          }
          exit $code
      - name: Keep probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b-ci-04-probes-win32-arm64
          path: ${{ runner.temp }}/b-ci-04-evidence
          if-no-files-found: error
