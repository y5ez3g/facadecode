name: Core checks

on:
  pull_request:
    paths:
      - 'core/**'
      - 'extension/src/base/names.ts'
      - '.github/workflows/core-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Core on ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Name the commits tests make
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Format
        if: matrix.target == 'linux-x64'
        run: cargo fmt --check
      - name: Lint
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/facade-tests"
          TMPDIR="$RUNNER_TEMP/facade-tests" scripts/test-all.sh
      - name: Agents outlive an SSH login
        if: ${{ !cancelled() && matrix.target == 'linux-x64' }}
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q openssh-server
          sudo systemctl start ssh
          mkdir -p ~/.ssh
          chmod go-w ~ && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -t ed25519 localhost >> ~/.ssh/known_hosts
          mkdir -p "$RUNNER_TEMP/facade-tests"
          TMPDIR="$RUNNER_TEMP/facade-tests" scripts/ssh-check.sh
      - name: Keep the failed run's files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-tests-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/facade-tests
            core/target/test-all.log
            core/target/test-all.log.full
          if-no-files-found: ignore

  each-commit:
    name: Core at each commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # check-each-commit.sh builds in a worktree of its own; this reuses the cached dependencies.
      CARGO_TARGET_DIR: ${{ github.workspace }}/core/target
    defaults:
      run:
        shell: bash
        working-directory: core
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || '' }}
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Each commit builds and leaves Cargo.lock as it is
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: scripts/check-each-commit.sh "$(git merge-base "$BASE" HEAD)"
