name: Intel macOS Core handoff canary
run-name: Intel macOS Core handoff (${{ inputs.reuse_core && 'reuse' || 'control' }})

on:
  workflow_dispatch:
    inputs:
      reuse_core:
        description: Stage Core from the package job in this attempt
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    shell: bash
    working-directory: extension

env:
  FACADE_PACKAGE_TARGET: darwin-x64
  CARGO_INCREMENTAL: '0'

jobs:
  package:
    name: Intel macOS Core package
    if: inputs.reuse_core
    runs-on: macos-15-intel
    timeout-minutes: 60
    outputs:
      attempt: ${{ steps.evidence.outputs.attempt }}
      evidence_sha256: ${{ steps.evidence.outputs.sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: extension/.nvmrc
      - name: Rust toolchain for Core
        working-directory: core
        run: rustup toolchain install
      - run: npm ci
      - name: Build the native package
        run: npm run package -- --target "$FACADE_PACKAGE_TARGET"
      - run: npm run test:package
      - name: Pack Core from the native VSIX
        run: |
          node ../core/scripts/package-core.mjs --target "$FACADE_PACKAGE_TARGET" \
            --vsix "build/vsix/facadecode-$FACADE_PACKAGE_TARGET-"*.vsix --out-dir build/core
      - name: Record the native package digests
        id: evidence
        run: |
          node scripts/native-package-evidence.mjs stamp build --target "$FACADE_PACKAGE_TARGET"
          digest=$(shasum -a 256 build/native-package-evidence.json | cut -d ' ' -f1)
          printf 'attempt=%s\nsha256=%s\n' "$GITHUB_RUN_ATTEMPT" "$digest" >> "$GITHUB_OUTPUT"
      - name: Upload the Core handoff
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intel-core-${{ github.run_attempt }}
          path: |
            extension/build/vsix/*.vsix
            extension/build/core/facade-core-darwin-x64.tar.gz
            extension/build/core/SHA256SUMS
            extension/build/native-package-evidence.json
          if-no-files-found: error
          compression-level: 0

  editor:
    name: Intel macOS Rust editor
    needs: package
    if: ${{ !cancelled() && needs.package.result == (inputs.reuse_core && 'success' || 'skipped') }}
    permissions:
      contents: read
      actions: read
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: extension/.nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the native package target
        run: |
          node --input-type=module <<'JS'
          import { packageTarget } from './scripts/native.mjs';
          console.info(`Building and testing ${packageTarget(process.env.FACADE_PACKAGE_TARGET)}`);
          JS
      - name: Download and verify the Core handoff
        if: inputs.reuse_core
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_ATTEMPT: ${{ needs.package.outputs.attempt }}
          PACKAGE_ARTIFACT_ID: ${{ needs.package.outputs.artifact_id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ needs.package.outputs.artifact_digest }}
          PACKAGE_EVIDENCE_SHA256: ${{ needs.package.outputs.evidence_sha256 }}
        run: |
          python -B - <<'PY'
          from hashlib import sha256
          import json
          import os
          from pathlib import Path
          import re
          import sys

          sys.path.insert(0, 'ci')
          from github_evidence import download_artifact, gh_json

          env = os.environ
          attempt = env['GITHUB_RUN_ATTEMPT']
          if env['PACKAGE_ATTEMPT'] != attempt:
              raise SystemExit('Core handoff requires the package job from this run attempt.')
          artifact_id = env['PACKAGE_ARTIFACT_ID']
          digest = env['PACKAGE_ARTIFACT_DIGEST'].removeprefix('sha256:')
          evidence_digest = env['PACKAGE_EVIDENCE_SHA256']
          if (not re.fullmatch(r'[1-9][0-9]*', artifact_id)
                  or any(not re.fullmatch(r'[a-f0-9]{64}', value) for value in (digest, evidence_digest))):
              raise SystemExit('Core handoff is missing its artifact ID or SHA-256.')
          repository = env['GITHUB_REPOSITORY']
          name = f'intel-core-{attempt}'
          run = env['GITHUB_RUN_ID']
          revision = env['GITHUB_SHA']
          record = gh_json(f'repos/{repository}/actions/artifacts/{artifact_id}')
          if ((record['id'], record['name'], record['expired'], record['digest'],
               record['workflow_run']['id'], record['workflow_run']['head_sha'])
                  != (int(artifact_id), name, False, f'sha256:{digest}', int(run), revision)):
              raise SystemExit('Core handoff artifact differs from the producing job outputs.')
          output = Path(env['RUNNER_TEMP']) / 'facade-intel-core'
          output.mkdir()
          directory = download_artifact(repository, record, output, name)
          evidence_bytes = (directory / 'native-package-evidence.json').read_bytes()
          if sha256(evidence_bytes).hexdigest() != evidence_digest:
              raise SystemExit('Core handoff package evidence differs from the producing job digest.')
          evidence = json.loads(evidence_bytes)
          source = evidence['source']
          if ((source['revision'], source['run'], source['attempt'], evidence['target'])
                  != (revision, run, attempt, env['FACADE_PACKAGE_TARGET'])):
              raise SystemExit('Core handoff package evidence names another revision, run, attempt or target.')
          print(f'Verified {name} artifact {artifact_id} on {revision}, tree {source["tree"]}, run {run}/{attempt}.')
          PY
      - name: Rust toolchain for Core
        if: "!inputs.reuse_core"
        working-directory: core
        run: rustup toolchain install
      - name: Download official VS Code for isolated tests
        timeout-minutes: 9
        run: |
          python -B ../ci/editor_archive.py "$FACADE_PACKAGE_TARGET" \
            --cache "$RUNNER_TEMP/facade-desktop-cache" --stage "$RUNNER_TEMP/facade-desktop" \
            --log "$RUNNER_TEMP/facade-desktop.log" --github-env "$GITHUB_ENV"
      - run: npm ci
      - run: npm run compile
      - run: npm run bundle
      - name: Build the isolated editor fixtures
        env:
          REUSE_CORE: ${{ inputs.reuse_core }}
          PACKAGE_EVIDENCE_SHA256: ${{ needs.package.outputs.evidence_sha256 }}
        run: |
          if [[ "$REUSE_CORE" == true ]]; then
            node scripts/build-it.mjs --core-package "$RUNNER_TEMP/facade-intel-core/intel-core-$GITHUB_RUN_ATTEMPT" \
              --core-package-evidence-sha256 "$PACKAGE_EVIDENCE_SHA256"
          else
            node scripts/build-it.mjs
          fi
      - name: Isolated editor journeys on macOS
        env:
          FACADE_IT_ENGINE: rust
        run: node build/out/test/integration/run.js 2>&1 | tee build/integration.log
      - name: Keep editor test output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intel-canary-editor-tests-rust-${{ github.run_attempt }}
          path: extension/build/integration.log
          if-no-files-found: ignore
