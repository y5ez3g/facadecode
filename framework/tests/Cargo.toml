[package]
name = "facade-scenarios"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Scenario tests that run built Facade programs in isolated Facade homes, with the fake CLI they drive and the stress test."

[lib]
path = "src/lib.rs"

[dependencies]
facade-base.workspace = true
facade-screen.workspace = true
facade-rules.workspace = true
anyhow.workspace = true
crossterm.workspace = true
serde_json.workspace = true
rusqlite.workspace = true

[dev-dependencies]
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
nix.workspace = true

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
toml.workspace = true
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }
