[package]
name = "facade-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "facade-mcp, the relay that passes each MCP line between a CLI and the Facade daemon."

[[bin]]
name = "facade-mcp"
path = "src/main.rs"

[dependencies]
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
# Not the workspace's nix: the relay uses only poll, the user calls, and on Linux the socket
# option that names the daemon's user (SO_PEERCRED).
nix = { version = "0.31", default-features = false, features = ["poll", "user", "socket", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Threading"] }

# Stricter than the workspace: the relay is meant to change almost never.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
